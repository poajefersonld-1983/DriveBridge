[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebridge"
version = "0.1.0"
description = "Cliente leve de sincronização de pastas com Google Drive para Linux"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["google-api-python-client>=2.100,<3", "google-auth-oauthlib>=1.2,<2", "google-auth-httplib2>=0.2,<1", "httplib2>=0.19,<1"]

[project.optional-dependencies]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
drivebridge = "drivebridge.app:main"
drivebridge-web = "drivebridge.web:main"

[tool.setuptools.packages.find]
include = ["drivebridge*"]

[tool.setuptools.package-data]
drivebridge = ["resources/oauth-client.json", "templates/*.html", "static/*.css", "static/*.js"]
